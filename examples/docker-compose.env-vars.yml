# Pi-hole + DoT/DoH + pihole-updatelists + Lancache DNS
# CONFIG APPROACH: Environment variables
#
# All settings controlled via environment variables in this file.
# On first start the container auto-creates two config files if missing:
#   ./config/dnsproxy.yml          → DoT/DoH upstream config; or skip file editing with DNSPROXY_UPSTREAM env var
#   ./cache-domains/config/config.json → not needed when LANCACHE_IP env var is set
#
# To switch to file-based pihole-updatelists config instead of env vars:
#   - Uncomment the ./pihole-updatelists volume line below
#   - Create ./pihole-updatelists/pihole-updatelists.conf with your list URLs
#   - Remove the BLOCKLISTS_URL / WHITELIST_URL / REGEX_BLACKLIST_URL env vars
#   See examples/docker-compose.file-config.yml for the file-based approach

services:
  pihole:
    container_name: pihole
    image: mwatz/pihole-dot-doh-updatelists-lancache-cache-domains:latest
    hostname: pihole
    domainname: pihole.local
    ports:
      - "53:53/tcp"    # DNS
      - "53:53/udp"    # DNS
      - "80:80/tcp"    # Admin UI HTTP (redirects to HTTPS)
      - "443:443/tcp"  # Admin UI HTTPS
      - "853:853/tcp"  # Optional: DoT passthrough for clients that query Pi-hole via DoT directly
      - "853:853/udp"
      # - "67:67/udp"  # DHCP — uncomment if using Pi-hole as DHCP server (Linux only; see note below)
    environment:
      # ── Required ────────────────────────────────────────────────────────────────
      - TZ=America/Los_Angeles
      - FTLCONF_webserver_api_password=<your-password-here>
      - FTLCONF_dns_upstreams=127.0.0.1#5054        # Routes queries through dnsproxy for DoT/DoH
      - FTLCONF_dns_listeningMode=all               # Listen on all interfaces (required in Docker)

      # ── Recommended ─────────────────────────────────────────────────────────────
      - FTLCONF_LOCAL_IPV4=192.168.1.10             # Your Pi-hole server's LAN IP

      # ── Optional Pi-hole settings ────────────────────────────────────────────────
      #- FTLCONF_dns_dnssec=true                    # Enable DNSSEC validation

      # Local hostname resolution via your router (reverse DNS)
      #- FTLCONF_rev_server=true
      #- FTLCONF_rev_server_target=192.168.1.1      # Your router IP
      #- FTLCONF_rev_server_domain=localdomain
      #- FTLCONF_rev_server_cidr=192.168.1.0/24

      # DHCP server — requires 67:67/udp port + network_mode: host on Linux (see bottom of file)
      #- FTLCONF_dhcp_active=true
      #- FTLCONF_dhcp_start=192.168.1.100
      #- FTLCONF_dhcp_end=192.168.1.200
      #- FTLCONF_dhcp_router=192.168.1.1

      # ── Lancache server IP ───────────────────────────────────────────────────────
      # Points all ~26 gaming CDN groups (Steam, Epic, Xbox, Blizzard, etc.) to your Lancache server
      # Env var: rewrites config.json on every restart — /etc/cache-domains volume mount not required
      # File-based alternative: omit this var, mount /etc/cache-domains, edit ./cache-domains/config/config.json
      - LANCACHE_IP=192.168.1.10                    # ← Replace with your Lancache server IP

      # ── pihole-updatelists ───────────────────────────────────────────────────────
      # Runs on container start and weekly via cron (default: random time 3-4 AM Sunday)
      # BLOCKLISTS_URL: Collection/index URLs only — not direct blocklist file URLs
      - BLOCKLISTS_URL=https://v.firebog.net/hosts/lists.php?type=tick https://www.github.developerdan.com/hosts/lists/ads-and-tracking-extended.txt
      # WHITELIST_URL: Exact-match domain whitelists (handcrafted false-positive lists)
      - WHITELIST_URL=https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/referral-sites.txt https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/optional-list.txt https://raw.githubusercontent.com/mmotti/pihole-regex/master/whitelist.list
      # REGEX_BLACKLIST_URL: Regex-based blocking rules
      - REGEX_BLACKLIST_URL=https://raw.githubusercontent.com/mmotti/pihole-regex/master/regex.list
      # Other available variables:
      #- ALLOWLISTS_URL=          # Collection URLs for allowlist indexes
      #- BLACKLIST_URL=           # Exact domains to block (plain domain format, not hosts files)
      #- REGEX_WHITELIST_URL=     # Regex patterns for whitelisting

      # ── Scheduling overrides ─────────────────────────────────────────────────────
      #- CRONTAB_STRING=0 3 * * 0          # pihole-updatelists cron (default: random 3-4 AM Sunday)
      #- LANCACHE_CRONTAB_STRING=17 4 * * * # lancache update cron (default: 4:17 AM daily)

      # ── DNSProxy upstream resolver (env var approach — optional) ─────────────────
      # When set: generates /config/dnsproxy.yml on every start from these values
      # When not set: uses /config/dnsproxy.yml if it exists, otherwise auto-creates from defaults
      # Note: if set, do not hand-edit /config/dnsproxy.yml — this env var overwrites it each start
      # Default (Cloudflare DoT + DoH fallback — active without this env var):
      #- DNSPROXY_UPSTREAM=tls://1.1.1.1 tls://1.0.0.1 https://cloudflare-dns.com/dns-query
      # Family filter — blocks adult content:
      #- DNSPROXY_UPSTREAM=tls://1.1.1.3 tls://1.0.0.3 https://family.cloudflare-dns.com/dns-query
      # Malware/Unsafe filter:
      #- DNSPROXY_UPSTREAM=tls://1.1.1.2 tls://1.0.0.2 https://security.cloudflare-dns.com/dns-query
      # Quad9:
      #- DNSPROXY_UPSTREAM=tls://9.9.9.9 https://dns.quad9.net/dns-query
      # Bootstrap IPs (for DoH hostname resolution; add 127.0.0.11 for corporate/VPN networks):
      #- DNSPROXY_BOOTSTRAP=1.1.1.1 1.0.0.1 9.9.9.9

    volumes:
      - './etc-pihole:/etc/pihole'           # Required: gravity DB, FTL data, blocklists
      - './config:/config'                   # Recommended: dnsproxy.yml (resets to default without this; optional when DNSPROXY_UPSTREAM is set)
      - './etc-dnsmasq.d:/etc/dnsmasq.d'    # Optional: regenerated on every start
      # /etc/cache-domains not needed when using LANCACHE_IP env var
      # Uncomment if switching to file-based lancache config (and remove LANCACHE_IP env var above):
      #- './cache-domains:/etc/cache-domains'
      # Uncomment to use file-based pihole-updatelists config (and remove list env vars above):
      #- './pihole-updatelists:/etc/pihole-updatelists/'

    cap_add:
      - NET_ADMIN        # Required: manage network interfaces, firewall rules, and DNS routing
      - NET_BIND_SERVICE # Required: bind to privileged ports (53, 80, 443)
      - SYS_NICE         # Optional: raise Pi-hole process priority for lower DNS latency
      - NET_RAW          # Optional: raw socket access — needed for DHCP functionality
      - CHOWN            # Optional: set file ownership on mapped volume directories

    restart: unless-stopped

    # ── DHCP on Linux hosts only ─────────────────────────────────────────────────
    # DHCP requires host network mode on Linux (broadcast packets can't cross Docker's bridge).
    # Docker Desktop (Windows/Mac) does not support DHCP — use your router's DHCP instead.
    # If enabling: comment out the ports: block above and uncomment network_mode below.
    #
    # network_mode: host
